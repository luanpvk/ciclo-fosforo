<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciclo do Fósforo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <main class="stage">
      <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Simulação do ciclo do fósforo">
        <defs>
          <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
            <stop id="skyTop" offset="0" stop-color="#6ec6ff"/>
            <stop id="skyBot" offset="1" stop-color="#e6f6ff"/>
          </linearGradient>
          <linearGradient id="gSoil" x1="0" y1="590" x2="0" y2="900" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7d5734"/>
            <stop offset=".4" stop-color="#5c3e23"/>
            <stop offset="1" stop-color="#3a2817"/>
          </linearGradient>
          <linearGradient id="gBedrock" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4a423b"/>
            <stop offset="1" stop-color="#2c2723"/>
          </linearGradient>
          <linearGradient id="gRock" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c2b8ad"/>
            <stop offset="1" stop-color="#5f5750"/>
          </linearGradient>
          <linearGradient id="gWater" x1="0" y1="645" x2="0" y2="830" gradientUnits="userSpaceOnUse">
            <stop id="waterTop" offset="0" stop-color="#4fb3ea"/>
            <stop id="waterBot" offset="1" stop-color="#1d5f99"/>
          </linearGradient>
          <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a6d98f"/>
            <stop offset="1" stop-color="#78b765"/>
          </linearGradient>
          <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9dbfd6"/>
            <stop offset="1" stop-color="#c7dfe9"/>
          </linearGradient>
          <radialGradient id="gSun">
            <stop offset="0" stop-color="#fff7c2"/>
            <stop offset=".5" stop-color="#ffd84d" stop-opacity=".8"/>
            <stop offset="1" stop-color="#ffd84d" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="mClip"><path d="M10,600 L90,410 L150,320 L205,365 L255,290 L315,410 L345,600 Z"/></clipPath>
          <linearGradient id="gRockShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
            <stop offset=".6" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".28"/>
          </linearGradient>
          <linearGradient id="gPit" x1="0" y1="600" x2="0" y2="648" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#cdbb9e"/>
            <stop offset="1" stop-color="#8f7c63"/>
          </linearGradient>
          <pattern id="pApatite" width="16" height="12" patternUnits="userSpaceOnUse">
            <rect width="16" height="12" fill="#6f8f80"/>
            <circle cx="4" cy="3" r="1.6" fill="#a8e6cf"/>
            <circle cx="12" cy="9" r="1.3" fill="#a8e6cf"/>
            <circle cx="11" cy="2" r=".9" fill="#4d6b5c"/>
          </pattern>
          <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
          <!-- região fixa em coordenadas da cena: evita o "quadrado" cortando o desfoque -->
          <filter id="plumeBlur" filterUnits="userSpaceOnUse" x="1080" y="590" width="360" height="230"><feGaussianBlur stdDeviation="7"/></filter>
          <clipPath id="waterClip"><path d="M1010,645 C1050,820 1360,830 1400,645 Z"/></clipPath>
          <filter id="spotBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
          <mask id="spotMask" maskUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1300">
            <rect x="-200" y="-200" width="2000" height="1300" fill="#fff"/>
            <ellipse id="spotHole" fill="#000" filter="url(#spotBlur)"/>
          </mask>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".35"/>
          </filter>
        </defs>

        <!-- céu -->
        <rect width="1600" height="900" fill="url(#gSky)"/>
        <g id="sun">
          <g id="rays" stroke="#ffe680" stroke-width="4" stroke-linecap="round" opacity=".5"></g>
          <circle cx="1380" cy="120" r="120" fill="url(#gSun)"/>
          <circle cx="1380" cy="120" r="44" fill="#ffe46b"/>
        </g>
        <g id="clouds"></g>
        <g id="birds" stroke="#34495e" stroke-width="2.4" fill="none" stroke-linecap="round"></g>

        <!-- montanhas distantes e colinas -->
        <path d="M0,500 L90,430 L170,470 L290,380 L420,455 L540,410 L660,470 L800,400 L930,460 L1060,395 L1190,450 L1330,390 L1460,445 L1600,410 L1600,900 L0,900 Z" fill="url(#gFar)" opacity=".85"/>
        <path d="M290,380 L320,402 L300,400 L280,392 Z M800,400 L830,422 L812,420 L790,410 Z M1330,390 L1362,414 L1340,410 L1320,400 Z" fill="#fff" opacity=".8"/>
        <path d="M0,540 Q220,450 470,505 T980,480 T1600,490 L1600,900 L0,900 Z" fill="url(#gHill)"/>
        <g id="farTrees"></g>

        <!-- estrada até a cidade -->
        <path id="road" d="M770,600 C820,580 870,562 960,552 C1060,542 1160,535 1300,545 C1440,555 1460,575 1520,585" stroke="#cdb98d" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M770,600 C820,580 870,562 960,552 C1060,542 1160,535 1300,545 C1440,555 1460,575 1520,585" stroke="#fff6dc" stroke-width="1.5" stroke-dasharray="8 10" fill="none" opacity=".8"/>
        <g id="truck"><g id="truckBody"></g></g>

        <!-- montanha de rocha sedimentar em camadas -->
        <g id="rock">
          <path id="rockShape" d="M10,600 L90,410 L150,320 L205,365 L255,290 L315,410 L345,600 Z" fill="#b5a99b"/>
          <g clip-path="url(#mClip)">
            <path d="M0,200 L400,316 L400,416 L0,300 Z" fill="#cbc0b3"/>
            <path d="M0,300 L400,416 L400,496 L0,380 Z" fill="#b8ac9e"/>
            <path d="M0,380 L400,496 L400,556 L0,440 Z" fill="#c6baac"/>
            <path d="M0,440 L400,556 L400,614 L0,497 Z" fill="#a99d8f"/>
            <path d="M0,545 L400,662 L400,700 L0,700 Z" fill="#988c7f"/>
            <path d="M0,300 L400,416 M0,380 L400,496 M0,440 L400,556" stroke="#6f655b" stroke-width="1.5" opacity=".45"/>
            <rect width="400" height="600" fill="url(#gRockShade)"/>
          </g>
          <path d="M150,320 L205,365 L255,290 L248,338 L207,384 L163,350 Z" fill="#fff" opacity=".22"/>
        </g>

        <!-- solo, rocha matriz e bacia do lago -->
        <path d="M0,600 L960,600 C990,605 1000,630 1010,645 C1050,820 1360,830 1400,645 C1410,615 1425,590 1450,585 L1600,585 L1600,900 L0,900 Z" fill="url(#gSoil)"/>
        <path d="M480,748 Q620,740 800,752 T1010,760 M1400,760 Q1500,740 1600,752" stroke="#000" stroke-width="2" opacity=".12" fill="none"/>
        <path d="M0,830 Q260,805 560,835 T1120,850 T1600,830 L1600,900 L0,900 Z" fill="url(#gBedrock)"/>
        <g id="cracks" stroke="#1d1a17" stroke-width="2" fill="none" opacity=".5"></g>
        <g id="pebbles" fill="#000" opacity=".13"></g>
        <path d="M1010,645 C1050,820 1360,830 1400,645 C1350,862 1060,852 1010,645 Z" fill="#9b8458"/>
        <g id="roots" stroke="#c9a77a" stroke-width="1.5" opacity=".45" fill="none"></g>

        <!-- camada de rocha fosfática (fosforita), que mergulha sob o solo -->
        <path id="oreLayer" d="M50,512 L345,598 L470,630 C488,634 490,664 470,668 L345,640 L50,560 Z" fill="url(#pApatite)" stroke="#3f5a4c" stroke-width="2" stroke-linejoin="round"/>

        <!-- mina a céu aberto: cava em bancadas até a camada de fosfato -->
        <path id="pit" d="M340,600 L346,616 L356,616 L360,632 L370,632 L374,648 L426,648 L430,632 L440,632 L444,616 L454,616 L460,600 Z" fill="url(#gPit)" stroke="#5c4630" stroke-width="2" stroke-linejoin="round"/>
        <path d="M349,616 L451,616 M363,632 L437,632" stroke="#eadcc0" stroke-width="2" opacity=".7"/>
        <g id="excavator">
          <rect x="382" y="642" width="26" height="6" rx="3" fill="#2f2f2f"/>
          <rect x="385" y="632" width="19" height="10" rx="2" fill="#f2b705"/>
          <rect x="387" y="624" width="10" height="9" rx="1.5" fill="#f2b705"/>
          <rect x="389" y="626" width="6" height="4" fill="#bfe6ff"/>
          <g class="dig">
            <path d="M403,634 L414,620 L421,636" stroke="#d99a00" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
            <path d="M417,635 L425,635 L423,641 L418,641 Z" fill="#555"/>
          </g>
        </g>
        <line class="belt" x1="424" y1="644" x2="484" y2="582" stroke="#555" stroke-width="5" stroke-linecap="round"/>
        <line x1="470" y1="597" x2="470" y2="602" stroke="#555" stroke-width="3"/>

        <path d="M0,600 L340,600 M460,600 L960,600 C990,605 1000,630 1010,645 M1400,645 C1410,615 1425,590 1450,585 L1600,585" stroke="#5fae46" stroke-width="12" fill="none" stroke-linecap="round"/>
        <g id="tufts" stroke="#4c9a3a" stroke-width="2.2" stroke-linecap="round" fill="none"></g>
        <g id="flowers"></g>

        <!-- lago -->
        <path id="water" d="M1010,645 C1050,820 1360,830 1400,645 Z" fill="url(#gWater)"/>
        <g id="seaweed" fill="none" stroke-width="4" stroke-linecap="round"></g>
        <g id="bubbles" fill="none" stroke="#e8f0d0" stroke-width="1.5" opacity="0"></g>
        <g id="fish"></g>
        <!-- pluma do esgoto saindo do emissário e se espalhando na água -->
        <g clip-path="url(#waterClip)">
          <g id="plume" filter="url(#plumeBlur)"></g>
        </g>
        <g id="foam" fill="#f1ecd8"></g>
        <g id="ripples" fill="none" stroke="#fff" stroke-width="1.5"></g>
        <g id="algae"></g>
        <g id="ducks"></g>
        <g id="reeds"></g>

        <!-- fábrica de fertilizantes -->
        <g id="factory">
          <rect x="524" y="486" width="16" height="62" fill="#8d93a3"/>
          <rect x="522" y="486" width="20" height="7" fill="#e86f51"/>
          <path d="M470,600 L470,548 L492,535 L492,548 L514,535 L514,548 L548,548 L548,600 Z" fill="#d4d9e2"/>
          <rect x="476" y="574" width="12" height="10" rx="2" fill="#ffd27a"/>
          <rect x="494" y="574" width="12" height="10" rx="2" fill="#ffd27a"/>
          <rect x="526" y="578" width="16" height="22" fill="#7d8494"/>
          <text x="509" y="564" class="sign">NPK</text>
          <g id="smoke" fill="#d9dde3"></g>
        </g>

        <!-- lavoura -->
        <g id="crops"></g>
        <g id="fence" stroke="#8a6a44" stroke-width="3" stroke-linecap="round"></g>
        <g id="tractor"><g id="tractorBody"></g></g>

        <!-- consumidores e decompositores -->
        <g id="cow" transform="translate(812 601)"></g>
        <g id="sheep" transform="translate(868 601)"></g>
        <g id="log">
          <rect x="895" y="587" width="56" height="14" rx="7" fill="#7a4f2a"/>
          <circle cx="951" cy="594" r="7" fill="#a9774a"/>
          <circle cx="951" cy="594" r="3" fill="none" stroke="#7a4f2a" stroke-width="1.2"/>
          <g id="mushrooms"></g>
        </g>

        <!-- mata ciliar -->
        <g id="riparian"></g>

        <!-- cidade, esgoto e estação de tratamento -->
        <!-- rede de esgoto: casas -> coletor -> (ETE) -> lago -->
        <g id="sewer" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1542,586 L1542,606 M1566,586 L1566,606 M1590,586 L1590,606 L1475,606 C1450,622 1430,648 1404,663" stroke="#4b5360" stroke-width="10"/>
          <path d="M1542,586 L1542,606 M1566,586 L1566,606 M1590,586 L1590,606 L1475,606 C1450,622 1430,648 1404,663" stroke="#8b95a3" stroke-width="4"/>
          <!-- emissário: boca do cano com muro de concreto na margem -->
          <g transform="rotate(-30 1405 662)" stroke="none">
            <rect x="1399" y="650" width="15" height="24" rx="2" fill="#a7afb8"/>
            <rect x="1399" y="650" width="4" height="24" fill="#8a929c"/>
            <ellipse cx="1402" cy="662" rx="3.6" ry="6.5" fill="#1f2329"/>
          </g>
        </g>
        <!-- estação de tratamento de esgoto (ETE) -->
        <g id="ete">
          <path d="M1470,594 L1470,606 M1507,592 L1507,606" stroke="#4b5360" stroke-width="5"/>
          <rect x="1452" y="574" width="36" height="20" rx="2" fill="#c3cad1" stroke="#7d8794" stroke-width="1.5"/>
          <rect x="1455" y="577" width="30" height="5" fill="#8fd3f0"/>
          <g fill="#fff">
            <circle class="etebub" cx="1460" cy="582" r="1.4"/><circle class="etebub" cx="1467" cy="582" r="1.2" style="animation-delay:-.4s"/>
            <circle class="etebub" cx="1474" cy="582" r="1.5" style="animation-delay:-.8s"/><circle class="etebub" cx="1481" cy="582" r="1.2" style="animation-delay:-1.2s"/>
          </g>
          <rect x="1494" y="576" width="26" height="16" fill="#c3cad1" stroke="#7d8794" stroke-width="1.5"/>
          <ellipse cx="1507" cy="576" rx="13" ry="4" fill="#8fd3f0" stroke="#7d8794" stroke-width="1.5"/>
          <line class="bridge" x1="1495" y1="576" x2="1519" y2="576" stroke="#4b5360" stroke-width="1.6"/>
        </g>
        <g id="town"></g>

        <!-- chuva -->
        <g id="rain" stroke="#d6ecff" stroke-width="2" stroke-linecap="round" opacity=".75"></g>

        <!-- fluxos, átomos e rótulos -->
        <g id="flows"></g>
        <g id="particles" filter="url(#glow)"></g>
        <g id="spot" opacity="0">
          <rect x="-200" y="-200" width="2000" height="1300" fill="#04100a" opacity=".6" mask="url(#spotMask)"/>
          <ellipse id="spotRing" class="spot-ring"/>
        </g>
        <g id="badges"></g>
      </svg>

      <div class="legend">
        <span><i class="dot nat"></i>P natural</span>
        <span><i class="dot fert"></i>P de fertilizante</span>
        <span><b class="num">12</b> = quantidade de P no local</span>
      </div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
      <span id="zoomHint" class="zoom-hint">🖱️ Role para dar zoom · arraste para mover</span>
      <div class="zoom">
        <button id="zoomIn" aria-label="Aproximar">+</button>
        <button id="zoomOut" aria-label="Afastar">−</button>
        <button id="zoomReset" aria-label="Ver tudo">⤢</button>
      </div>

      <div id="presCard" class="pres-card" aria-live="polite">
        <div class="pres-head">
          <span id="pStep" class="p-step"></span>
          <span class="p-progress"><i id="pBar"></i></span>
        </div>
        <div id="pBody" class="p-body">
          <h2 id="pTitle"></h2>
          <p id="pText" class="p-text"></p>
          <div id="pExtra" class="p-extra"></div>
          <div id="pLive" class="p-live">
            <div><small>O₂ (mg/L)</small><b id="pO2"></b></div>
            <div><small>Algas</small><b id="pAlg"></b></div>
            <div><small>Peixes vivos</small><b id="pFish"></b></div>
          </div>
        </div>
      </div>
      <div class="pres-ctrl">
        <button id="pPrev" aria-label="Etapa anterior"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M18.5 5.5 9.5 12l9 6.5z" class="f"/></svg></button>
        <button id="pAuto" aria-label="Pausar apresentação"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" class="f"/><rect x="13.5" y="5" width="4" height="14" rx="1" class="f"/></svg></button>
        <button id="pNext" aria-label="Próxima etapa"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="M5.5 5.5 14.5 12l-9 6.5z" class="f"/></svg></button>
        <button id="pMute" aria-label="Desligar voz"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" class="f"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
        <button id="pFull" aria-label="Tela cheia"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
        <button id="pExit" aria-label="Sair da apresentação"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </main>

    <aside class="panel">
      <header class="brand">
        <div class="tile"><small>15</small><b>P</b></div>
        <div>
          <h1>Ciclo do Fósforo</h1>
          <span class="sub">Simulador interativo</span>
        </div>
      </header>

      <section class="sec">
        <h3 class="sec-title">Simulação</h3>
        <div class="row">
          <button id="play" class="icon-btn primary" aria-label="Pausar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" class="f"/><rect x="13.5" y="5" width="4" height="14" rx="1" class="f"/></svg></button>
          <button id="reset" class="icon-btn" aria-label="Reiniciar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.6h4.6"/></svg></button>
          <div class="seg" id="speed" role="group" aria-label="Velocidade">
            <button data-v="0.5">½×</button><button data-v="1" class="on">1×</button><button data-v="2">2×</button><button data-v="4">4×</button>
          </div>
        </div>
      </section>

      <section class="sec">
        <h3 class="sec-title">Cenários</h3>
        <div class="chips" id="presets">
          <button data-p="natural"><i class="dot-c" style="--c:#5ee09a"></i>Natural</button>
          <button data-p="intensivo"><i class="dot-c" style="--c:#ff7b39"></i>Intensivo</button>
          <button data-p="sustentavel"><i class="dot-c" style="--c:#6fd3ff"></i>Sustentável</button>
        </div>
      </section>

      <section class="sec">
        <h3 class="sec-title">Controles</h3>
        <label class="ctl">
          <span class="ctl-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4.4 3-7 7.5-7 0 4.4-3 7-7.5 7z"/><path d="M12 14.5C12 11 9.6 9 5 9c0 3.5 2.4 5.5 7 5.5z"/></svg>Fertilizante</span><b id="fertOut"></b>
          <input type="range" id="fert" min="0" max="100" value="20">
        </label>
        <label class="ctl">
          <span class="ctl-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15.5a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 9a3.3 3.3 0 0 1-.6 6.5z"/><path d="M8.5 19l-1 2M12.5 19l-1 2M16.5 19l-1 2"/></svg>Chuva</span><b id="rainOut"></b>
          <input type="range" id="rainCtl" min="0" max="100" value="30">
        </label>
        <label class="switch"><span class="ctl-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-5"/><path d="M12 3 6.5 10H9l-3.5 6h13L15 10h2.5z"/></svg>Mata ciliar</span><input type="checkbox" id="mata" checked><i></i></label>
        <label class="switch"><span class="ctl-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5s6 6.3 6 10.7a6 6 0 0 1-12 0c0-4.4 6-10.7 6-10.7z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>Tratamento de esgoto</span><input type="checkbox" id="esgoto" checked><i></i></label>
      </section>

      <section class="sec">
        <h3 class="sec-title">Apresentação</h3>
        <label class="select">
          <span class="ctl-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Voz do narrador</span>
          <select id="voiceSel"></select>
        </label>
        <button id="presentBtn" class="present-btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M12 16.5V20M8 20.5h8"/><path d="M10.4 7.8v5l4.2-2.5z" class="f"/></svg>Iniciar apresentação</button>
      </section>

      <section class="lake">
        <div class="lake-head">
          <h3 class="sec-title">Lago</h3>
          <span id="trophic" class="trophic t0">Oligotrófico</span>
        </div>
        <div class="stats">
          <div><small>Fósforo</small><b id="sP">0</b></div>
          <div><small>O₂</small><b id="sO2">0</b></div>
          <div><small>Algas</small><b id="sAlg">0</b></div>
